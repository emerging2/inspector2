name: CMC Collector 201-300

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cmc-collector-201-300
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run CMC collector 201-300
        env:
          CMC_API_KEY: ${{ secrets.TOKEN_COINB }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python recolector_cmc2.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cmc/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "data: collect CMC market snapshot 201-300"
            git pull --rebase origin main
            git push
          fi
